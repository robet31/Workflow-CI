name: ML Workflow CI - Wine Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Check Env
      run: |
        python --version
        pip --version
        echo "Working directory: $(pwd)"
        ls -la MLProject/

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas numpy scikit-learn matplotlib seaborn

    - name: Set MLflow Tracking URI
      run: |
        echo "MLFLOW_TRACKING_URI=file:///tmp/mlruns" >> $GITHUB_ENV

    - name: Run mlflow project
      run: |
        cd MLProject
        python modelling.py 100 10
      env:
        MLFLOW_TRACKING_URI: file:///tmp/mlruns

    - name: Get latest MLflow run_id
      id: get_run_id
      run: |
        RUN_ID=$(cat MLProject/run_id.txt)
        echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        echo "MLflow Run ID: $RUN_ID"

    - name: Install Python dependencies for artifact upload
      run: |
        pip install requests

    - name: Upload artifacts to GitHub
      uses: actions/upload-artifact@v3
      with:
        name: mlflow-artifacts
        path: |
          MLProject/training_confusion_matrix.png
          MLProject/metric_info.json
          MLProject/run_id.txt
          /tmp/mlruns/

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image with MLflow
      run: |
        # Build docker image from MLflow project
        cd MLProject
        mlflow models build-docker \
          -m "runs:/${{ steps.get_run_id.outputs.run_id }}/model" \
          -n "ravnxx/wine-quality-model:latest" \
          --enable-mlserver || \
        mlflow models build-docker \
          -m "runs:/${{ steps.get_run_id.outputs.run_id }}/model" \
          -n "ravnxx/wine-quality-model:latest" || \
        echo "Docker build via mlflow failed, building manually..."

    - name: Push Docker Image to Docker Hub
      run: |
        docker push ravnxx/wine-quality-model:latest || echo "Push failed - check Docker Hub credentials"
